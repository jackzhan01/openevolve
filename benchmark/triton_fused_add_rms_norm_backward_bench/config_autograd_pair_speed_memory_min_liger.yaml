max_iterations: 10
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  primary_model: "gpt-5.5"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 20000
  timeout: 300

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.
    Your target to beat is Liger's hand-optimized FusedAddRmsNorm implementation.

    Improve the code inside the EVOLVE-BLOCK. The public API is:

        def fused_add_rms_norm_forward_with_saved(x, r, weight, eps):
            return out, saved_tensors

        def fused_add_rms_norm_backward_from_saved(dout, saved_tensors, eps):
            return dx, dr, dweight

        Forward: for each row, form s = x + r, compute row RMS inverse rstd = rsqrt(mean_j(s_j^2) + eps) in fp32, and return y_j = s_j * rstd * weight_j. Backward: given dy, compute g_j = dy_j * weight_j, row dot t = sum_j(g_j * s_j), ds_j = rstd * (g_j - s_j * rstd^2 * t / cols), with dx = ds and dr = ds; also compute dweight_j = sum_rows(dy_row,j * s_row,j * rstd_row).

        y = (x + r) * rsqrt(mean((x + r)^2, dim=-1, keepdim=True) + eps) * weight

    The evaluator scores min(backward_speedup, full_step_speedup) against Liger's hand-optimized forward/backward as the
    baseline, with a small saved-memory penalty. Correctness is a hard requirement.

database:
  population_size: 30
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
max_code_length: 30000
