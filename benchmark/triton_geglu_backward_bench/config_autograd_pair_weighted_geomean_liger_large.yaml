max_iterations: 10
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  primary_model: "gpt-5.5"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 20000
  timeout: 300

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.
    Your target to beat is Liger's hand-optimized Geglu Triton kernel, not PyTorch autograd.

        Large-regime suite: specialize for the streaming / high-occupancy end.

    Improve the code inside the EVOLVE-BLOCK. The public API is:

        def geglu_forward_with_saved(a, b):
            return c, saved_tensors

        def geglu_backward_from_saved(dc, saved_tensors):
            return da, db

        Forward is element-wise GeGLU (GELU-gated activation), tanh approximation:
            k      = sqrt(2/pi) = 0.7978845608028654
            z      = k * (a + 0.044715 * a^3)
            gelu_a = 0.5 * a * (1 + tanh(z))
            c      = gelu_a * b

        Backward returns da and db:
            db = dc * gelu_a
            da = dc * b * d(gelu_a)/da
               = dc * b * ( 0.5*(1 + tanh(z))
                            + 0.5*a*(1 - tanh(z)^2) * k*(1 + 3*0.044715*a^2) )

        Both inputs a and b are [rows, cols].  Use the tanh approximation of GELU (NOT the exact
        erf GELU).  Use fp32 for the gelu/tanh computation and preserve input dtypes in outputs.
        The saved-tensor contract is flexible: forward can save any subset of intermediates
        (a, b, gelu_a, tanh(z), etc.), and backward should use exactly what was saved.

        gelu_a=0.5*a*(1+tanh(k*(a+0.044715*a^3))), k=sqrt(2/pi); db=dc*gelu_a; da=dc*b*d(gelu_a)/da

    The evaluator scores a weighted geomean of per-shape min(backward_speedup, full_step_speedup) against Liger's own forward/backward kernels as the
    baseline, with a small saved-memory penalty. Correctness is a hard requirement.

database:
  population_size: 30
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
max_code_length: 30000
