max_iterations: 10
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  primary_model: "gpt-5.5"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 20000
  timeout: 300

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.
    Your target to beat is Liger's hand-optimized ReluSquared implementation.

    Improve the code inside the EVOLVE-BLOCK. The public API is:

        def relu_squared_forward_with_saved(x):
            return out, saved_tensors

        def relu_squared_backward_from_saved(dout, saved_tensors):
            return dx

        Forward: y = relu(x)^2 = max(x, 0)^2 element-wise. Backward: given upstream gradient dy, compute dx = dy * 2 * x for x > 0, and dx = 0 for x <= 0; gradients are only w.r.t. x.

        y = max(x,0)^2; dx = grad_out * 2 * max(x,0) * 1[x>0] = grad_out * 2*x*1[x>0].

    The evaluator scores min(backward_speedup, full_step_speedup) against Liger's hand-optimized forward/backward as the
    baseline, with a small saved-memory penalty. Correctness is a hard requirement.

database:
  population_size: 30
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
max_code_length: 30000
