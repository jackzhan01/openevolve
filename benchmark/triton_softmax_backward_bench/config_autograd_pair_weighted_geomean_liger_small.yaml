max_iterations: 10
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  primary_model: "gpt-5.5"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 20000
  timeout: 300

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.
    Your target to beat is Liger's hand-optimized Softmax Triton kernel, not PyTorch autograd.

        Small suite: cols < 16384. Row fits one block -> single-pass reduction; fused one-pass kernel with modest warps.

    Improve the code inside the EVOLVE-BLOCK. The public API is:

        def softmax_forward_with_saved(x):
            return y, saved_tensors

        def softmax_backward_from_saved(dy, saved_tensors):
            return dx

        Forward: y = softmax(x, dim=-1) (numerically stable). Backward: s=sum(dy*y,-1,keepdim); dx = y*(dy - s). Row reduction over cols.

        Flexible saved contract: forward naturally saves y (dx depends only on y and dy); backward returns dx [rows,cols]. Liger backward is not in-place.

    The evaluator scores a weighted geomean of per-shape min(backward_speedup, full_step_speedup) against Liger's own forward/backward kernels as the
    baseline, with a small saved-memory penalty. Correctness is a hard requirement.

database:
  population_size: 30
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
max_code_length: 30000
