max_iterations: 10
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  primary_model: "gpt-5.5"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 20000
  timeout: 300

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.
    Your target to beat is Liger's hand-optimized SwiGLU Triton kernel, not PyTorch autograd.

    Improve the code inside the EVOLVE-BLOCK. The public API is:

        def swiglu_forward_with_saved(a, b):
            return c, saved_tensors

        def swiglu_backward_from_saved(dc, saved_tensors):
            return da, db

    Forward is element-wise SwiGLU: c = silu(a) * b, where silu(x) = x*sigmoid(x).
    Backward returns da and db:
        sig_a  = sigmoid(a)
        silu_a = a * sig_a
        db     = dc * silu_a
        da     = dc * b * (silu_a * (1 - sig_a) + sig_a)

    The evaluator measures backward_from_saved latency, raw forward+backward full-step
    latency, and saved tensor memory, all against Liger's own forward/backward kernels
    as the baseline. The score is min(backward_speedup, full_step_speedup) with a small
    saved-memory penalty.

    This is a memory-bandwidth-bound element-wise op: every extra full-size tensor the
    forward pass writes out (beyond the output c) costs real time on large shapes, even
    if it makes backward cheaper to compute. Liger's baseline forward only writes c and
    reuses the original inputs (a, b) as the saved tensors, recomputing sigmoid in
    backward instead of saving it. Only save extra precomputed tensors (e.g. sig_a,
    silu_a, or a fused gradient term) if the backward-side compute you avoid is worth
    more than the extra forward memory traffic — this tradeoff should be validated across
    both small (launch-overhead-bound) and large (bandwidth-bound) shapes, not just one
    regime.

    The saved-tensor contract is evolvable: forward can save any intermediates
    (e.g. a, b, sig_a, silu_a), and backward must use exactly those saved tensors.
    Saving fewer or smaller tensors reduces the memory penalty.

    Use fp32 for sigmoid/silu computation. Preserve input dtypes in da and db.
    Correctness is a hard requirement.

database:
  population_size: 30
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
max_code_length: 30000
