max_iterations: 10
checkpoint_interval: 5
log_level: "INFO"
max_tasks_per_child: 1

llm:
  primary_model: "gpt-5.5"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.5
  max_tokens: 20000
  timeout: 300

prompt:
  system_message: |
    You are an expert Triton GPU programmer optimizing an autograd-pair kernel.
    Your target to beat is Liger's hand-optimized Tvd implementation.

        Large-regime suite: specialize for the streaming / high-occupancy end.

    Improve the code inside the EVOLVE-BLOCK. The public API is:

        def tvd_forward_with_saved(p, q):
            return out, saved_tensors

        def tvd_backward_from_saved(dout, saved_tensors):
            return dp, dq

        Forward computes total variation distance averaged over rows: loss = (0.5 * abs(p - q)).sum() / rows, with p and q treated as row-wise probability distributions. Backward computes elementwise gradients dloss/dp = 0.5 / rows * sign(p - q) and dloss/dq = -0.5 / rows * sign(p - q), using PyTorch abs subgradient 0 where p == q.

        loss = 0.5 / rows * sum_ij |p_ij - q_ij|; grad_p = 0.5 / rows * sign(p - q), grad_q = -grad_p.

    The evaluator scores a weighted geomean of per-shape min(backward_speedup, full_step_speedup) against Liger's hand-optimized forward/backward as the
    baseline, with a small saved-memory penalty. Correctness is a hard requirement.

database:
  population_size: 30
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.75
  similarity_threshold: 0.99

evaluator:
  timeout: 300
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: true
max_code_length: 30000
